<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Preact + htm (~30x plus leger que React, sans compilateur). Bibliotheques embarquees dans vendor/ : aucun telechargement. -->
    <script type="module">
      import { html, render, useState, useEffect, useRef } from './vendor/htm@3.1.1/es2022/preact/standalone.bundle.js';
      import * as zebar from './vendor/zebar@3.3.1/es2022/zebar.bundle.js';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu', refreshInterval: 2000 },
        memory: { type: 'memory', refreshInterval: 2000 },
        audio: { type: 'audio' },
        systray: { type: 'systray' },
        date: { type: 'date', formatting: 'EEE d MMM  HH:mm', locale: 'fr-FR' },
      });

      // Lance une commande Windows (autorisee dans zpack.json).
      const run = (program, args) => zebar.shellExec(program, args).catch(err => console.error(err));
      const openUri = uri => run('explorer', [uri]);
      // Panneau natif Windows via son raccourci (petit programme compile, instantane).
      const openFlyout = panel => run('C:\\ProgramData\\Mamumi-Os\\flyout.exe', [panel]);

      // Toutes les fenetres d'un arbre GlazeWM (y compris dans les sous-conteneurs).
      const collectWindows = node =>
        !node ? [] : node.type === 'window' ? [node] : (node.children ?? []).flatMap(collectWindows);

      const speed = m => (m ? `${Math.round(m.siValue)}${m.siUnit}` : '-');
      const go = bytes => (bytes / 1073741824).toFixed(1);
      const HISTORY = 30;   // 30 mesures x 2 s = la derniere minute

      // Mini graphique (0-100 %) des dernieres mesures.
      function Sparkline({ values, cls }) {
        const w = 60, h = 14;
        if (values.length < 2) return html`<svg class=${`spark ${cls}`} width=${w} height=${h}></svg>`;
        const step = w / (HISTORY - 1), x0 = w - (values.length - 1) * step;
        const pts = values.map((v, i) => `${(x0 + i * step).toFixed(1)},${(h - 1 - (Math.min(v, 100) / 100) * (h - 2)).toFixed(1)}`).join(' ');
        return html`
          <svg class=${`spark ${cls}`} width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`}>
            <polyline points=${`${x0},${h} ${pts} ${w},${h}`} class="area" />
            <polyline points=${pts} class="line" />
          </svg>`;
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [powerOpen, setPowerOpen] = useState(false);
        const [statsOpen, setStatsOpen] = useState(false);
        const hist = useRef({ cpu: [], mem: [], lastCpu: null, lastMem: null });

        useEffect(() => {
          providers.onOutput(() => {
            const o = providers.outputMap, h = hist.current;
            // Historique : une valeur par nouvelle mesure.
            if (o.cpu && o.cpu !== h.lastCpu) { h.lastCpu = o.cpu; h.cpu = [...h.cpu, o.cpu.usage].slice(-HISTORY); }
            if (o.memory && o.memory !== h.lastMem) { h.lastMem = o.memory; h.mem = [...h.mem, o.memory.usage].slice(-HISTORY); }
            setOutput({ ...o });
          });
        }, []);
        const openTaskManager = e => { e.preventDefault(); run('taskmgr', []); };

        const gwm = output.glazewm;

        // --- Reseau (en Ethernet il n'y a pas toujours de passerelle : on regarde l'IP) ---
        const net = output.network;
        const iface = net?.defaultInterface;
        const online = !!(iface && (iface.ipv4Addresses?.length || iface.ipv6Addresses?.length));
        const netIcon = (() => {
          if (!online) return 'nf-md-wifi_strength_off_outline';
          if (iface.type === 'ethernet') return 'nf-md-ethernet_cable';
          const s = net.defaultGateway?.signalStrength ?? 0;
          return s >= 80 ? 'nf-md-wifi_strength_4' : s >= 60 ? 'nf-md-wifi_strength_3'
               : s >= 40 ? 'nf-md-wifi_strength_2' : 'nf-md-wifi_strength_1';
        })();

        // --- Son ---
        const dev = output.audio?.defaultPlaybackDevice;
        const volume = dev ? Math.round(dev.volume) : 0;
        const muted = !!dev?.isMuted;
        const volIcon = muted || volume === 0 ? 'nf-md-volume_off'
                      : volume < 34 ? 'nf-md-volume_low' : volume < 67 ? 'nf-md-volume_medium' : 'nf-md-volume_high';
        const onVolumeWheel = e => {
          if (!dev) return;
          output.audio.setVolume(Math.max(0, Math.min(100, volume + (e.deltaY < 0 ? 5 : -5))));
        };
        const toggleMute = e => {
          e.preventDefault();
          if (output.audio?.setMute) output.audio.setMute(!muted);
          else openUri('ms-settings:sound');
        };

        // --- Fenetres reduites ---
        const minimized = gwm
          ? gwm.currentWorkspaces.flatMap(collectWindows).filter(w => w.state?.type === 'minimized')
          : [];

        const tray = output.systray;

        return html`
          <div class="app">
            <!-- Gauche : espaces de travail + fenetres reduites -->
            <div class="left">
              <i class="logo nf nf-md-moon_waning_crescent"></i>
              ${gwm && html`
                <div class="workspaces">
                  ${gwm.currentWorkspaces.map(ws => html`
                    <button key=${ws.name}
                      class=${`workspace ${ws.hasFocus ? 'focused' : ''} ${ws.isDisplayed ? 'displayed' : ''}`}
                      onClick=${() => gwm.runCommand(`focus --workspace ${ws.name}`)}>
                      ${ws.displayName ?? ws.name}
                    </button>`)}
                </div>`}
              ${minimized.length > 0 && html`
                <div class="minimized-list">
                  ${minimized.map(w => html`
                    <button key=${w.id} class="minimized" title=${w.title}
                      onClick=${() => gwm.runCommand('toggle-minimized', w.id)}>
                      <i class="nf nf-md-window_restore"></i>${w.processName}
                    </button>`)}
                </div>`}
            </div>

            <!-- Centre : date / heure -> calendrier -->
            <button class="center clock" title="Calendrier" onClick=${() => openFlyout('calendar')}>
              ${output.date?.formatted}
            </button>

            <!-- Droite : systeme -->
            <div class="right">
              ${gwm?.isPaused && html`
                <button class="pill paused-button" onClick=${() => gwm.runCommand('wm-toggle-pause')}>PAUSE</button>`}
              ${gwm?.bindingModes.map(m => html`
                <button key=${m.name} class="pill binding-mode"
                  onClick=${() => gwm.runCommand(`wm-disable-binding-mode --name ${m.name}`)}>
                  ${m.displayName ?? m.name}
                </button>`)}

              ${tray?.icons?.length > 0 && html`
                <div class="systray">
                  ${tray.icons.map(icon => html`
                    <img key=${icon.id} src=${icon.iconUrl} title=${icon.tooltip}
                      onClick=${e => { e.preventDefault(); tray.onLeftClick(icon.id); }}
                      onContextMenu=${e => { e.preventDefault(); tray.onRightClick(icon.id); }}
                      onDblClick=${e => { e.preventDefault(); tray.onLeftDoubleClick(icon.id); }} />`)}
                </div>`}

              <button class=${`module network ${online ? '' : 'offline'}`}
                title=${online ? (iface?.friendlyName ?? 'Connecte') : 'Pas de connexion internet'}
                onClick=${() => openFlyout('quick')}>
                <i class=${`nf ${netIcon}`}></i>
                ${online
                  ? html`<span class="dim">${net.defaultGateway?.ssid ? `${net.defaultGateway.ssid} ` : ''}↓${speed(net.traffic?.received)} ↑${speed(net.traffic?.transmitted)}</span>`
                  : html`<span>Hors ligne</span>`}
              </button>

              <button class="module bluetooth" title="Bluetooth" onClick=${() => openFlyout('quick')}>
                <i class="nf nf-md-bluetooth"></i>
              </button>

              ${dev && html`
                <div class="audio-wrap" onWheel=${onVolumeWheel}>
                  <button class=${`module audio ${muted ? 'muted' : ''}`}
                    title=${`${dev.name} - clic : panneau volume, clic droit : couper, molette : volume`}
                    onClick=${() => openFlyout('volume')}
                    onContextMenu=${toggleMute}>
                    <i class=${`nf ${volIcon}`}></i>${muted ? 'muet' : `${volume}%`}
                  </button>
                </div>`}

              ${output.memory && html`
                <button class=${`module memory ${statsOpen ? 'open' : ''}`}
                  title="RAM - clic : details, clic droit : Gestionnaire des taches"
                  onClick=${() => setStatsOpen(!statsOpen)} onContextMenu=${openTaskManager}>
                  <i class="nf nf-fae-chip"></i>
                  ${statsOpen && html`
                    <span class="detail">${go(output.memory.usedMemory)} / ${go(output.memory.totalMemory)} Go</span>
                    <${Sparkline} values=${hist.current.mem} cls="mem" />
                    ${output.memory.usedSwap > 0 && html`<span class="detail dim">swap ${go(output.memory.usedSwap)} Go</span>`}`}
                  <span class=${output.memory.usage > 85 ? 'high-usage' : ''}>${Math.round(output.memory.usage)}%</span>
                </button>`}
              ${output.cpu && html`
                <button class=${`module cpu ${statsOpen ? 'open' : ''}`}
                  title="Processeur - clic : details, clic droit : Gestionnaire des taches"
                  onClick=${() => setStatsOpen(!statsOpen)} onContextMenu=${openTaskManager}>
                  <i class="nf nf-oct-cpu"></i>
                  ${statsOpen && html`
                    <span class="detail dim">${output.cpu.physicalCoreCount}c/${output.cpu.logicalCoreCount}t</span>
                    <${Sparkline} values=${hist.current.cpu} cls="cpu" />`}
                  <span class=${output.cpu.usage > 85 ? 'high-usage' : ''}>${Math.round(output.cpu.usage)}%</span>
                </button>`}

              <div class="power">
                ${powerOpen && html`
                  <div class="power-menu">
                    <button title="Verrouiller" onClick=${() => { setPowerOpen(false); run('rundll32', ['user32.dll,LockWorkStation']); }}>
                      <i class="nf nf-md-lock"></i>
                    </button>
                    <button title="Veille" onClick=${() => { setPowerOpen(false); run('rundll32', ['powrprof.dll,SetSuspendState', '0,1,0']); }}>
                      <i class="nf nf-md-sleep"></i>
                    </button>
                    <button title="Redemarrer" onClick=${() => run('shutdown', ['/r', '/t', '0'])}>
                      <i class="nf nf-md-restart"></i>
                    </button>
                    <button class="danger" title="Eteindre" onClick=${() => run('shutdown', ['/s', '/t', '0'])}>
                      <i class="nf nf-md-power"></i>
                    </button>
                  </div>`}
                <button class=${`module power-button ${powerOpen ? 'open' : ''}`} title="Alimentation"
                  onClick=${() => setPowerOpen(!powerOpen)}>
                  <i class=${`nf ${powerOpen ? 'nf-md-close' : 'nf-md-power'}`}></i>
                </button>
              </div>
            </div>
          </div>`;
      }

      render(html`<${App} />`, document.getElementById('root'));
    </script>
  </body>
</html>
