<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        audio: { type: 'audio' },
        systray: { type: 'systray' },
        date: { type: 'date', formatting: 'EEE d MMM  HH:mm', locale: 'fr-FR' },
      });

      // Lance une commande Windows (autorisee dans zpack.json).
      function run(program, args) {
        zebar.shellExec(program, args).catch(err => console.error(err));
      }
      const openUri = uri => run('explorer', [uri]);
      // Panneau natif Windows via son raccourci (petit programme compile, instantane).
      const openFlyout = panel => run('C:\\ProgramData\\Mamumi-Os\\flyout.exe', [panel]);

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [powerOpen, setPowerOpen] = useState(false);
        const [volumeOpen, setVolumeOpen] = useState(false);
        const [calError, setCalError] = useState(null);

        // Ouvre un panneau (widget du meme pack) : 'calendar' ou 'quick'.
        async function openPanel(name) {
          setCalError(null);
          try {
            await zebar.startWidgetPreset(name, 'default', { packId: zebar.currentWidget().packId });
          } catch (err) {
            setCalError(String(err?.message ?? err));
          }
        }
        // Calendrier = panneau natif de Windows (notifications + calendrier).
        const openCalendar = () => openFlyout('calendar');

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // --- Reseau ---
        const net = output.network;
        const iface = net?.defaultInterface;
        // En Ethernet il n'y a pas toujours de "passerelle" : on se base sur l'adresse IP.
        const online = !!(iface && (iface.ipv4Addresses?.length || iface.ipv6Addresses?.length));

        function networkIcon() {
          if (!online) return 'nf-md-wifi_strength_off_outline';
          if (iface.type === 'ethernet') return 'nf-md-ethernet_cable';
          const s = net.defaultGateway?.signalStrength ?? 0;
          if (s >= 80) return 'nf-md-wifi_strength_4';
          if (s >= 60) return 'nf-md-wifi_strength_3';
          if (s >= 40) return 'nf-md-wifi_strength_2';
          return 'nf-md-wifi_strength_1';
        }

        function speed(m) {
          if (!m) return '-';
          return `${Math.round(m.siValue)}${m.siUnit}`;
        }

        // --- Son ---
        const dev = output.audio?.defaultPlaybackDevice;
        const volume = dev ? Math.round(dev.volume) : null;
        const muted = !!dev?.isMuted;

        function volumeIcon() {
          if (muted || volume === 0) return 'nf-md-volume_off';
          if (volume < 34) return 'nf-md-volume_low';
          if (volume < 67) return 'nf-md-volume_medium';
          return 'nf-md-volume_high';
        }

        function onVolumeWheel(e) {
          if (!dev) return;
          const next = Math.max(0, Math.min(100, volume + (e.deltaY < 0 ? 5 : -5)));
          output.audio.setVolume(next);
        }

        function toggleMute() {
          if (output.audio?.setMute) output.audio.setMute(!muted);
          else openUri('ms-settings:sound');
        }

        // --- Fenetres reduites ---
        function collectWindows(node) {
          if (!node) return [];
          if (node.type === 'window') return [node];
          return (node.children ?? []).flatMap(collectWindows);
        }
        const minimizedWindows = output.glazewm
          ? output.glazewm.currentWorkspaces
              .flatMap(collectWindows)
              .filter(w => w.state?.type === 'minimized')
          : [];

        return (
          <div className="app">
            {/* ===== Gauche : espaces de travail + fenetres reduites ===== */}
            <div className="left">
              <i className="logo nf nf-md-moon_waning_crescent"></i>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(ws => (
                    <button
                      className={`workspace ${ws.hasFocus && 'focused'} ${ws.isDisplayed && 'displayed'}`}
                      onClick={() => output.glazewm.runCommand(`focus --workspace ${ws.name}`)}
                      key={ws.name}
                    >
                      {ws.displayName ?? ws.name}
                    </button>
                  ))}
                </div>
              )}

              {minimizedWindows.length > 0 && (
                <div className="minimized-list">
                  {minimizedWindows.map(w => (
                    <button
                      className="minimized"
                      key={w.id}
                      title={w.title}
                      onClick={() => output.glazewm.runCommand('toggle-minimized', w.id)}
                    >
                      <i className="nf nf-md-window_restore"></i>
                      {w.processName}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* ===== Centre : date/heure -> calendrier ===== */}
            <button
              className="center clock"
              title="Calendrier"
              onClick={openCalendar}
            >
              {output.date?.formatted}
              {calError && <span className="cal-error"> ⚠ {calError}</span>}
            </button>

            {/* ===== Droite : systeme ===== */}
            <div className="right">
              {output.glazewm?.isPaused && (
                <button className="pill paused-button" onClick={() => output.glazewm.runCommand('wm-toggle-pause')}>
                  PAUSE
                </button>
              )}
              {output.glazewm?.bindingModes.map(m => (
                <button
                  className="pill binding-mode"
                  key={m.name}
                  onClick={() => output.glazewm.runCommand(`wm-disable-binding-mode --name ${m.name}`)}
                >
                  {m.displayName ?? m.name}
                </button>
              ))}

              {/* Zone de notification (Discord, Steam...) : clic gauche / clic droit */}
              {output.systray?.icons?.length > 0 && (
                <div className="systray">
                  {output.systray.icons.map(icon => (
                    <img
                      key={icon.id}
                      src={icon.iconUrl}
                      title={icon.tooltip}
                      onClick={e => { e.preventDefault(); output.systray.onLeftClick(icon.id); }}
                      onContextMenu={e => { e.preventDefault(); output.systray.onRightClick(icon.id); }}
                      onDoubleClick={e => { e.preventDefault(); output.systray.onLeftDoubleClick(icon.id); }}
                    />
                  ))}
                </div>
              )}

              {/* Internet */}
              <button
                className={`module network ${online ? '' : 'offline'}`}
                title={online ? (iface?.friendlyName ?? 'Connecte') : 'Pas de connexion internet'}
                onClick={() => openFlyout('quick')}
              >
                <i className={`nf ${networkIcon()}`}></i>
                {online ? (
                  <span className="dim">
                    {net.defaultGateway?.ssid ? `${net.defaultGateway.ssid} ` : ''}
                    {'↓'}{speed(net.traffic?.received)} {'↑'}{speed(net.traffic?.transmitted)}
                  </span>
                ) : (
                  <span>Hors ligne</span>
                )}
              </button>

              {/* Bluetooth */}
              <button
                className="module bluetooth"
                title="Bluetooth"
                onClick={() => openFlyout('quick')}
              >
                <i className="nf nf-md-bluetooth"></i>
              </button>

              {/* Son */}
              {dev && (
                <div className="audio-wrap" onWheel={onVolumeWheel}>
                  <button
                    className={`module audio ${muted ? 'muted' : ''}`}
                    title={`${dev.name} - clic : panneau volume, clic droit : couper, molette : volume`}
                    onClick={() => openFlyout('volume')}
                    onContextMenu={e => { e.preventDefault(); toggleMute(); }}
                  >
                    <i className={`nf ${volumeIcon()}`}></i>
                    {muted ? 'muet' : `${volume}%`}
                  </button>
                </div>
              )}

              {/* RAM / CPU */}
              {output.memory && (
                <div className="module memory" title="RAM">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}
              {output.cpu && (
                <div className="module cpu" title="Processeur">
                  <i className="nf nf-oct-cpu"></i>
                  <span className={output.cpu.usage > 85 ? 'high-usage' : ''}>
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}

              {/* Alimentation */}
              <div className="power">
                {powerOpen && (
                  <div className="power-menu">
                    <button title="Verrouiller" onClick={() => { setPowerOpen(false); run('rundll32', ['user32.dll,LockWorkStation']); }}>
                      <i className="nf nf-md-lock"></i>
                    </button>
                    <button title="Veille" onClick={() => { setPowerOpen(false); run('rundll32', ['powrprof.dll,SetSuspendState', '0,1,0']); }}>
                      <i className="nf nf-md-sleep"></i>
                    </button>
                    <button title="Redemarrer" onClick={() => run('shutdown', ['/r', '/t', '0'])}>
                      <i className="nf nf-md-restart"></i>
                    </button>
                    <button className="danger" title="Eteindre" onClick={() => run('shutdown', ['/s', '/t', '0'])}>
                      <i className="nf nf-md-power"></i>
                    </button>
                  </div>
                )}
                <button
                  className={`module power-button ${powerOpen ? 'open' : ''}`}
                  title="Alimentation"
                  onClick={() => setPowerOpen(!powerOpen)}
                >
                  <i className={`nf ${powerOpen ? 'nf-md-close' : 'nf-md-power'}`}></i>
                </button>
              </div>
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
